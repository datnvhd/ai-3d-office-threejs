# Ubuntu installer (.deb, x64). Built on Ubuntu 22.04 (the oldest supported), then installed with apt on a clean
# Ubuntu 24.04 runner and started there, so both the package's dependencies and the app are checked.
# Start it from the Actions tab (once this file is on the default branch) or by pushing a tag v*.
name: Ubuntu installer (.deb)
on:
  workflow_dispatch:
  push:
    tags: ['v*']
jobs:
  deb:
    name: Ubuntu x64 (build on 22.04)
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with: {node-version: 26, cache: npm}
      - run: npm ci --no-audit --no-fund
      - run: npx vite build
      - run: npx electron-builder --linux deb --x64 --publish never
      - uses: actions/upload-artifact@v4
        with:
          name: ai-3d-office-ubuntu-amd64
          path: release/*.deb
          if-no-files-found: error
  install-test:
    name: Ubuntu 24.04 (apt install + self-test)
    needs: deb
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@v4
        with: {name: ai-3d-office-ubuntu-amd64}
      - name: Install with apt
        timeout-minutes: 20
        run: |
          # the runner's DNS sometimes cannot resolve the Ubuntu archives ("Temporary failure resolving"): use public DNS
          # first, keep the runner's own resolver as the last fallback; try the main archive before the Azure mirror
          sudo rm -f /etc/resolv.conf
          printf 'nameserver 1.1.1.1\nnameserver 8.8.8.8\nnameserver 127.0.0.53\noptions timeout:2 attempts:2\n' | sudo tee /etc/resolv.conf
          getent hosts archive.ubuntu.com || echo "chưa phân giải được archive.ubuntu.com"
          if [ -f /etc/apt/apt-mirrors.txt ]; then
            printf 'http://archive.ubuntu.com/ubuntu/\nhttp://azure.archive.ubuntu.com/ubuntu/\n' | sudo tee /etc/apt/apt-mirrors.txt
          fi
          APT='-o Acquire::Retries=3 -o Acquire::http::Timeout=20'
          for i in 1 2 3; do
            sudo apt-get $APT update -qq &&
              sudo apt-get $APT install -y -qq ./ai-3d-office_*_ubuntu_amd64.deb xvfb && exit 0
            echo "apt lỗi (lần $i), thử lại sau 30 giây"; sleep 30
          done
          exit 1
      - name: Self-test the installed app
        run: |
          which ai-3d-office
          AI_OFFICE_SELFTEST=1 xvfb-run -a ai-3d-office --no-sandbox | tee selftest.txt
          grep -q '"page":200' selftest.txt
