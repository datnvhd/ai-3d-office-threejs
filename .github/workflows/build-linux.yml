# Ubuntu installer (.deb, x64). Built on Ubuntu 22.04 (the oldest supported), then installed with apt on a clean
# Ubuntu 24.04 runner and started there, so both the package's dependencies and the app are checked.
# Start it from the Actions tab (once this file is on the default branch) or by pushing a tag v*.
name: build-linux
on:
  workflow_dispatch:
  push:
    tags: ['v*']
jobs:
  deb:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with: {node-version: 22, cache: npm}
      - run: npm ci --no-audit --no-fund
      - run: npx vite build
      - run: npx electron-builder --linux deb --x64 --publish never
      - uses: actions/upload-artifact@v4
        with:
          name: ai-3d-office-ubuntu-amd64
          path: release/*.deb
          if-no-files-found: error
  install-test:
    needs: deb
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@v4
        with: {name: ai-3d-office-ubuntu-amd64}
      - name: Install with apt
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ./ai-3d-office_*_amd64.deb xvfb
      - name: Self-test the installed app
        run: |
          which ai-3d-office
          AI_OFFICE_SELFTEST=1 xvfb-run -a ai-3d-office --no-sandbox | tee selftest.txt
          grep -q '"page":200' selftest.txt
