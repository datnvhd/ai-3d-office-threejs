# macOS installers: one .dmg per chip, each built on a runner of that chip (native modules are per chip).
# Start it from the Actions tab, with `npm run dist:mac -- --ci`, or by pushing a tag v*.
# Optional secrets for a signed + notarized app: MAC_CERT_P12_BASE64, MAC_CERT_PASSWORD (Developer ID Application),
# APPLE_ID, APPLE_APP_SPECIFIC_PASSWORD, APPLE_TEAM_ID. Without them the app is signed ad-hoc.
name: macOS installer (.dmg)
on:
  workflow_dispatch:
  push:
    tags: ['v*']
jobs:
  dmg:
    name: macOS ${{ matrix.arch == 'arm64' && 'Apple Silicon (arm64)' || 'Intel (x64)' }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - {runner: macos-15, arch: arm64}
          - {runner: macos-15-intel, arch: x64}
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with: {node-version: 22, cache: npm}
      - run: npm ci --no-audit --no-fund
      - name: Build dmg
        run: node scripts/build-mac.js --${{ matrix.arch }}
        env:
          CSC_LINK: ${{ secrets.MAC_CERT_P12_BASE64 }}
          CSC_KEY_PASSWORD: ${{ secrets.MAC_CERT_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      - name: Self-test the packaged app
        run: |
          APP=$(ls -d release/mac*/*.app | head -1)
          echo "App: $APP"
          codesign --verify --deep --strict "$APP" && echo "codesign OK"
          AI_OFFICE_SELFTEST=1 "$APP/Contents/MacOS/AI 3D Office" | tee selftest.txt
          grep -q '"page":200' selftest.txt
      - uses: actions/upload-artifact@v4
        with:
          name: ai-3d-office-macos-${{ matrix.arch }}
          path: release/*.dmg
          if-no-files-found: error
