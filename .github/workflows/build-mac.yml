# macOS installers: one .dmg per chip. Both are built on GitHub's Intel Macs (macos-15-intel), which are always
# available; the Apple Silicon (M-chip) runners are often queued for a long time for lack of capacity. For arm64,
# scripts/build-mac.js adds the arm64 native modules (node-pty, esbuild, rollup) from package-lock.json, and the
# packaged app is checked to be arm64 throughout (an Intel Mac cannot start it; the x64 app gets a full self-test).
# Start it from the Actions tab, with `npm run dist:mac -- --ci`, or by pushing a tag v*.
# Optional secrets for a signed + notarized app: MAC_CERT_P12_BASE64, MAC_CERT_PASSWORD (Developer ID Application),
# APPLE_ID, APPLE_APP_SPECIFIC_PASSWORD, APPLE_TEAM_ID. Without them the app is signed ad-hoc.
name: macOS installer (.dmg)
on:
  workflow_dispatch:
  push:
    tags: ['v*']
jobs:
  dmg:
    name: macOS ${{ matrix.arch == 'arm64' && 'Apple Silicon (arm64)' || 'Intel (x64)' }}
    strategy:
      fail-fast: false
      matrix:
        arch: [arm64, x64]
    runs-on: macos-15-intel
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with: {node-version: 26, cache: npm}
      - run: npm ci --no-audit --no-fund
      - name: Build dmg
        run: node scripts/build-mac.js --${{ matrix.arch }}
        env:
          CSC_LINK: ${{ secrets.MAC_CERT_P12_BASE64 }}
          CSC_KEY_PASSWORD: ${{ secrets.MAC_CERT_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      - name: Check the packaged app
        env: {ARCH: '${{ matrix.arch }}'}
        # Results are also written as annotations (::notice:: / ::error::), which show on the run page and in the API
        run: |
          fail(){ echo "::error title=macOS $ARCH::$1"; exit 1; }
          note(){ echo "$1"; echo "::notice title=macOS $ARCH::$1"; }
          LIPO=$([ "$ARCH" = x64 ] && echo x86_64 || echo arm64)   # lipo calls the Intel architecture x86_64
          APP=$(ls -d release/mac*/*.app 2>/dev/null | head -1 || true); [ -n "$APP" ] || fail "no .app in release/: $(ls release)"
          note "App: $APP"
          codesign --verify --deep --strict "$APP" 2>cs.txt || fail "codesign: $(tr '\n' ' ' < cs.txt)"
          MAIN="$APP/Contents/MacOS/AI 3D Office"
          a=$(lipo -archs "$MAIN") || fail "lipo failed on the main executable"
          echo "$a" | grep -qw "$LIPO" || fail "main executable is $a, expected $LIPO"
          RES="$APP/Contents/Resources/app/node_modules"
          # the native modules the app loads on this chip must be there and built for it
          # (the app path has spaces: read find's output NUL-separated, not word-split)
          found=""
          for m in "@lydell/node-pty-darwin-$ARCH" "@rollup/rollup-darwin-$ARCH" "@esbuild/darwin-$ARCH"; do
            [ -d "$RES/$m" ] || fail "missing $m (have: $(ls "$RES/$(dirname "$m")" 2>/dev/null | tr '\n' ' '))"
            n=0
            while IFS= read -r -d '' f; do
              a=$(lipo -archs "$f") || fail "lipo failed on $m/${f##*/}"
              echo "$a" | grep -qw "$LIPO" || fail "$m/${f##*/} is $a, expected $LIPO"
              found="$found ${f##*/}:$a"; n=$((n+1))
            done < <(find "$RES/$m" -type f \( -name '*.node' -o -name 'esbuild' -o -name 'spawn-helper' \) -print0)
            [ "$n" -gt 0 ] || fail "no binary found in $m"
          done
          fw="$APP/Contents/Frameworks/Electron Framework.framework/Electron Framework"
          a=$(lipo -archs "$fw") || fail "lipo failed on the Electron framework"
          echo "$a" | grep -qw "$LIPO" || fail "Electron framework is $a, expected $LIPO"
          note "all $LIPO: main executable, Electron framework,$found"
          # an Intel runner can start only the Intel app
          if [ "$ARCH" = x64 ]; then
            AI_OFFICE_SELFTEST=1 "$MAIN" > selftest.txt 2>selftest.err || true
            grep -q '"page":200' selftest.txt || fail "self-test: $(head -c 300 selftest.txt) $(tail -c 300 selftest.err)"
            note "self-test: $(head -c 200 selftest.txt)"
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: ai-3d-office-macos-${{ matrix.arch }}
          path: release/*.dmg
          if-no-files-found: error
